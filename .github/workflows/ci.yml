name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Only the latest commit on each branch or pull request needs a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-memory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run optimized allocator regressions and tag mutations
        run: make test-host
      - name: Run address and undefined-behavior sanitizers
        run: |
          make test-host BUILD=build/sanitized \
            HOST_CFLAGS="-O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all"

  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc make binutils \
            xorriso grub-pc-bin grub-common mtools qemu-system-x86

      - name: Record toolchain versions and host ISA defaults
        run: |
          gcc --version
          gcc -Q --help=target | grep -E 'march=|mtune=|mbmi'
          nasm -v
          grub-mkrescue --version
          qemu-system-x86_64 --version

      - name: Build ISO
        run: |
          make clean && make iso
          objdump -d build/kernel.bin > build/kernel.disassembly

      - name: Smoke-boot in QEMU and check serial output
        run: |
          timeout 60 qemu-system-x86_64 \
            -cdrom build/nutshell.iso \
            -display none \
            -serial file:serial.log \
            -no-reboot || true
          echo "----- serial.log -----"
          cat serial.log || true
          for marker in \
            "[ok] gdt" \
            "[ok] serial" \
            "[ok] vga" \
            "[ok] pmm" \
            "[ok] pmm-selftest" \
            "[ok] heap" \
            "[ok] heap-selftest" \
            "[ok] idt" \
            "[ok] pic" \
            "[ok] timer" \
            "[ok] keyboard" \
            "[ok] timer-tick" \
            "[ok] shell" \
            "Nutshell" \
            "nutshell> "; do
            grep -Fq "$marker" serial.log
          done

      - name: Run in-kernel self-tests
        run: |
          for memory in 16M 64M 256M; do
            make test QEMU_MEMORY="$memory"
            cp build/selftest-serial.log "build/selftest-${memory}.log"
          done

      - name: Exercise the real PS/2 shell and fault diagnostic
        run: make test-interactive

      - name: Verify baseline ISA overrides newer compiler defaults
        run: make test BUILD=build/isa-baseline CC="gcc -march=x86-64-v3"

      - name: Preserve boot and self-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-serial-logs
          path: |
            serial.log
            build/selftest-*.log
            build/interactive-*.log
            build/kernel.disassembly
